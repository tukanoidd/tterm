[package]
name = "tterm_term"
version.workspace = true
description = "Terminal emulator widget powered by ICED framework and alacritty terminal backend."
authors = [
  "Ilya Shvyryalkin <ilyashvy@gmail.com>",
  "Vitalii Lukyanov <tukanoid@outlook.com>",
]
repository.workspace = true
categories = ["gui"]
license.workspace = true
edition.workspace = true

[dependencies]
iced = { workspace = true, features = ["canvas", "lazy", "advanced"] }
iced_graphics = { workspace = true, default-features = false }
iced_core.workspace = true

alacritty_terminal.workspace = true

open.workspace = true

tokio = { workspace = true, features = ["full"] }

rootcause.workspace = true
