[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tukanoidd/tterm"
authors = ["Vitalii Lukyanov <tukanoid@outlook.com>"]

[workspace.dependencies]
tterm_term.path = "crates/tterm_term"

clap = "4.6"

iced = { version = "0.14", default-features = false }
iced_graphics = { version = "0.14", default-features = false }
iced_core = "0.14"
iced_aw = { version = "0.14", default-features = false }
iced_fonts = "0.3"
iced-swdir-tree = "0.9"

alacritty_terminal = "0.26"

directories = "6.0"
shellexpand = "3.1"
open = "5.3"

tokio = "1.52"

rand = "0.10"
uuid = "1.23"
url = "2.5"
smol_str = "0.3"
convert_case = "0.12"
itertools = "0.15"

chumsky = { version = "0.13", features = ["nightly"] }

bon = "3.9"
derive_more = "2.1"
ordered-float = "5.3"
smart-default = "0.7"
strum = "0.28"

serde = "1.0"
ron = "0.12"
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = "0.3"

thiserror = "2.0"
rootcause = "0.13"
rootcause-backtrace = "0.13"

# Macros
proc-macro2 = "1.0"
syn = "3.0"
darling = "0.24"
quote = "1.0"

[package]
name = "tterm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
trace = []
comet = ["trace", "iced/debug", "iced/hot", "iced/time-travel"]

[dependencies]
tterm-macros.path = "crates/tterm-macros"

clap = { workspace = true, features = ["derive"] }

iced = { workspace = true, features = [
  "wayland",
  "x11",
  "crisp",
  "wgpu",
  "linux-theme-detection",
  "web-colors",
  "advanced",
  "advanced-shaping",
  "tokio",
] }
iced_aw = { workspace = true, features = [
  "spinner",
  "badge",
  "drop_down",
  "context_menu",
] }
iced_fonts = { workspace = true, features = ["lucide"] }
iced-swdir-tree.workspace = true
tterm_term.workspace = true

directories.workspace = true
shellexpand.workspace = true

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "fs"] }

uuid = { workspace = true, features = ["v7"] }
url.workspace = true
itertools.workspace = true

chumsky.workspace = true

bon.workspace = true
derive_more = { workspace = true, features = [
  "debug",
  "display",
  "from",
  "as_ref",
] }
ordered-float = { workspace = true, features = ["serde"] }
smart-default.workspace = true
strum = { workspace = true, features = ["derive"] }

serde = { workspace = true, features = ["derive"] }
ron.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

rootcause.workspace = true
rootcause-backtrace.workspace = true

[profile.release]
strip = true
opt-level = "z"
lto = true

[profile.dev]
incremental = true
opt-level = "s"
lto = "thin"


[profile.dev.package."*"]
opt-level = 3
